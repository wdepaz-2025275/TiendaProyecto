<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Sistema Tienda Wilfred</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/Home.css}">
</head>
<body>

<nav class="navbar navbar-custom sticky-top shadow-lg">
    <div class="container d-flex justify-content-between align-items-center">
        <h3 class="m-0 fw-bold">TIENDA <span style="color: #a29bfe;">WILFRED</span></h3>

        <div class="d-flex align-items-center">
            <img th:src="${session.usuario.username == 'wilfred'} ? @{/img/Perfil.jpg} : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
                 class="img-perfil me-3"
                 alt="Perfil">

            <div class="text-start me-4">
                <p class="m-0 fw-bold" th:text="${session.usuario.username}" style="font-size: 1rem; line-height: 1;">username</p>
                <small class="text-uppercase" style="color: #a29bfe; font-size: 0.75rem; font-weight: 800;" th:text="${session.usuario.rol}">rol</small>
            </div>

            <a th:href="@{/logout}" class="btn btn-salir btn-sm px-4">SALIR</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="glass-container text-center">
                <h1 class="display-3 fw-bold mb-3">Panel de Control</h1>
                <p class="lead text-white-50 mb-5">Bienvenido al sistema de gestión administrativa</p>

                <div class="row g-4 justify-content-center">

                    <div class="col-6 col-md-4 col-lg-2">
                        <a th:href="@{/usuarios}" class="btn-modulo">
                            <h4>Usuarios</h4>
                            <p>Seguridad</p>
                        </a>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <a th:href="@{/clientes}" class="btn-modulo">
                            <h4>Clientes</h4>
                            <p>Cartera</p>
                        </a>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <a th:href="@{/productos}" class="btn-modulo">
                            <h4>Productos</h4>
                            <p>Inventario</p>
                        </a>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <a th:href="@{/ventas}" class="btn-modulo">
                            <h4>Ventas</h4>
                            <p>Facturación</p>
                        </a>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <a th:href="@{/detalles}" class="btn-modulo">
                            <h4>Detalles</h4>
                            <p>Historial</p>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
