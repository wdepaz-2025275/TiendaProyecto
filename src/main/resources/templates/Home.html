<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Sistema Tienda Wilfred</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/Home.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="#">
            TIENDA <span style="color: #a29bfe;">WILFRED</span>
        </a>

        <div class="d-flex align-items-center">
            <div class="profile-avatar me-3">
                <img th:src="${session.usuario.username == 'wilfred'} ? @{/img/Perfil.jpg} : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'" alt="Perfil">
            </div>
            <div class="text-start me-4 text-white d-none d-md-block">
                <p class="m-0 fw-bold lh-1" th:text="${session.usuario.username}">Username</p>
                <small class="text-uppercase op-7" style="color: #a29bfe; font-size: 0.7rem;" th:text="${session.usuario.rol}">Administrador</small>
            </div>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm px-3 rounded-pill">SALIR</a>
        </div>
    </div>
</nav>

<section class="hero-section text-center text-white d-flex align-items-center">
    <div class="container">
        <div class="glass-banner p-5">
            <h1 class="display-4 fw-bold">Bienvenido, <span th:text="${session.usuario.username}">Wilfred</span></h1>
            <p class="lead op-8">Gestiona el inventario, ventas y clientes de forma eficiente.</p>
        </div>
    </div>
</section>

<div class="container pb-5 mt-n5">
    <div class="row g-4 justify-content-center">

        <div class="col-6 col-md-4 col-lg-2">
            <a th:href="@{/usuarios}" class="card-module text-decoration-none">
                <div class="icon-circle bg-user"><i class="bi bi-people-fill"></i></div>
                <h5>Usuarios</h5>
                <p>Seguridad</p>
            </a>
        </div>

        <div class="col-6 col-md-4 col-lg-2">
            <a th:href="@{/clientes}" class="card-module text-decoration-none">
                <div class="icon-circle bg-client"><i class="bi bi-person-badge"></i></div>
                <h5>Clientes</h5>
                <p>Cartera</p>
            </a>
        </div>

        <div class="col-6 col-md-4 col-lg-2">
            <a th:href="@{/productos}" class="card-module text-decoration-none">
                <div class="icon-circle bg-prod"><i class="bi bi-box-seam"></i></div>
                <h5>Productos</h5>
                <p>Inventario</p>
            </a>
        </div>

        <div class="col-6 col-md-4 col-lg-2">
            <a th:href="@{/ventas}" class="card-module text-decoration-none">
                <div class="icon-circle bg-sale"><i class="bi bi-cart-check"></i></div>
                <h5>Ventas</h5>
                <p>Facturación</p>
            </a>
        </div>

        <div class="col-6 col-md-4 col-lg-2">
            <a th:href="@{/detalles}" class="card-module text-decoration-none">
                <div class="icon-circle bg-detail"><i class="bi bi-file-earmark-bar-graph"></i></div>
                <h5>Detalles</h5>
                <p>Historial</p>
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
