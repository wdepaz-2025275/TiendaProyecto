<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/Login.css}">

</head>
<body>

<div class="login-card">
    <div class="brand-icon">
        <i class="bi bi-shop"></i>
    </div>

    <h3 class="login-title" style="color: white !important;">TIENDA POS</h3>

    <div th:if="${error}" class="alert-error d-flex align-items-center">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label" style="color: rgba(255,255,255,0.8) !important;">USUARIO</label>
            <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label" style="color: rgba(255,255,255,0.8) !important;">CONTRASEÑA</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-access">
            ACCEDER AL SISTEMA
        </button>
    </form>

    <div class="mt-4">
        <a th:href="@{/registro}" style="color: var(--amarillo-pos); text-decoration: none; font-size: 0.9rem; font-weight: 600;">
            ¿No tienes cuenta? Regístrate aquí
        </a>
    </div>

    <p class="mt-3 mb-0 text-white-50 small">© 2026 Wilfred de Paz</p>
</div>

</body>
</html>
