<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/Clientes.css}"> </head>
<body>

<div class="container-fluid px-5 mt-4">
    <h1 class="titulo-seccion text-center mb-4">INVENTARIO DE PRODUCTOS</h1>

    <div class="btn-toolbar-custom mb-4 d-flex justify-content-start gap-2">
        <a th:href="@{/Home}" class="btn btn-outline-warning btn-custom"><i class="bi bi-house"></i> Inicio</a>
        <button type="button" class="btn btn-info text-white btn-custom" onclick="accionBuscar()"><i class="bi bi-search"></i> Buscar por ID</button>
        <button type="button" class="btn btn-success btn-custom" onclick="prepararNuevo()"><i class="bi bi-plus-circle"></i> Nuevo Producto</button>
        <button type="button" class="btn btn-warning fw-bold btn-custom" onclick="accionGestionar()"><i class="bi bi-gear-fill"></i> Gestionar ID</button>
    </div>

    <div class="tabla-contenedor shadow-lg">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre del Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listaProductos}">
                <td th:text="${p.codigoProducto}" class="fw-bold"></td>
                <td th:text="${p.nombreProducto}"></td>
                <td th:text="${'Q' + p.precio}"></td>
                <td th:text="${p.stock}"></td>
                <td>
                        <span th:class="${p.estado == 1 ? 'texto-verde fw-bold' : 'texto-rojo fw-bold'}"
                              th:text="${p.estado == 1 ? 'Activo' : 'Inactivo'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade text-dark" id="modalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-warning">
                <h5 class="modal-title" id="modalTitulo">Datos del Producto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="inputCodigo">
                <div class="mb-3">
                    <label class="fw-bold">Nombre del Producto</label>
                    <input type="text" id="inputNombre" class="form-control" placeholder="Ej: Jabón Antibacterial">
                </div>
                <div class="row">
                    <div class="col-6">
                        <label class="fw-bold">Precio (Q)</label>
                        <input type="number" step="0.01" id="inputPrecio" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold">Stock</label>
                        <input type="number" id="inputStock" class="form-control">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="fw-bold">Estado del Producto</label>
                    <select id="selectEstado" class="form-select">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger me-auto" id="btnEliminar" onclick="ejecutarEliminar()" style="display:none;">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-warning fw-bold" id="btnGuardar" onclick="ejecutarGuardado()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let miModal;
    document.addEventListener("DOMContentLoaded", () => {
        miModal = new bootstrap.Modal(document.getElementById('modalProducto'));
    });

    function accionBuscar() { const id = prompt("Código de producto:"); if(id) cargarDatos(id, true); }
    function accionGestionar() { const id = prompt("Código de producto:"); if(id) cargarDatos(id, false); }

    function prepararNuevo() {
        limpiarForm();
        setModo(true);
        document.getElementById('modalTitulo').innerText = "Nuevo Producto";
        document.getElementById('btnEliminar').style.display="none";
        miModal.show();
    }

    async function cargarDatos(id, soloLectura) {
        try {
            const res = await fetch(`/productos/${id}`);
            if(!res.ok) throw new Error();
            const p = await res.json();

            document.getElementById('inputCodigo').value = p.codigoProducto;
            document.getElementById('inputNombre').value = p.nombreProducto;
            document.getElementById('inputPrecio').value = p.precio;
            document.getElementById('inputStock').value = p.stock;
            document.getElementById('selectEstado').value = p.estado;

            document.getElementById('modalTitulo').innerText = soloLectura ? "Consulta de Producto" : "Editar Producto";
            setModo(!soloLectura);
            miModal.show();
        } catch(e) { alert("Producto no encontrado."); }
    }

    function setModo(e) {
        ['inputNombre','inputPrecio','inputStock','selectEstado'].forEach(i => {
            const el = document.getElementById(i);
            if(el.tagName === "SELECT") el.disabled = !e;
            else el.readOnly = !e;
        });
        document.getElementById('btnGuardar').style.display = e ? "block" : "none";
        document.getElementById('btnEliminar').style.display = (e && document.getElementById('inputCodigo').value) ? "block" : "none";
    }

    async function ejecutarGuardado() {
        const id = document.getElementById('inputCodigo').value;
        const payload = {
            codigoProducto: id ? parseInt(id) : null,
            nombreProducto: document.getElementById('inputNombre').value,
            precio: parseFloat(document.getElementById('inputPrecio').value),
            stock: parseInt(document.getElementById('inputStock').value),
            estado: parseInt(document.getElementById('selectEstado').value)
        };

        const res = await fetch('/productos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if(res.ok) location.reload();
        else alert("Error al guardar el producto.");
    }

    async function ejecutarEliminar() {
        const id = document.getElementById('inputCodigo').value;
        if(confirm("¿Eliminar este producto permanentemente?")) {
            await fetch(`/productos/${id}`, {method: 'DELETE'});
            location.reload();
        }
    }

    function limpiarForm() {
        document.getElementById('inputCodigo').value = "";
        document.getElementById('inputNombre').value = "";
        document.getElementById('inputPrecio').value = "";
        document.getElementById('inputStock').value = "";
        document.getElementById('selectEstado').value = "1";
    }
</script>
</body>
</html>
