<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/Clientes.css}">
</head>
<body>

<div class="container-fluid px-5 mt-4">
    <h1 class="titulo-seccion text-center mb-4">GESTIÓN DE USUARIOS</h1>

    <div class="btn-toolbar-custom mb-4 d-flex justify-content-start gap-2">
        <a th:href="@{/Home}" class="btn btn-outline-warning btn-custom"><i class="bi bi-house"></i> Inicio</a>
        <button type="button" class="btn btn-info text-white btn-custom" onclick="accionBuscar()"><i class="bi bi-search"></i> Buscar ID</button>
        <button type="button" class="btn btn-success btn-custom" onclick="prepararNuevo()"><i class="bi bi-person-plus-fill"></i> Nuevo Usuario</button>
        <button type="button" class="btn btn-warning fw-bold btn-custom" onclick="accionGestionar()"><i class="bi bi-gear-fill"></i> Gestionar ID</button>
    </div>

    <div class="tabla-contenedor shadow-lg">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th style="width: 10%;">Código</th>
                <th style="width: 20%;">Username</th>
                <th style="width: 25%;">Email</th>
                <th style="width: 20%;">Rol</th>
                <th style="width: 15%;">Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${listaUsuarios}">
                <td th:text="${u.codigoUsuario}" class="fw-bold"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
                <td class="text-center align-middle">
                    <span th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}"
                          th:class="${u.estado == 1 ? 'texto-verde' : 'texto-rojo'}">
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade text-dark" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-warning">
                <h5 class="modal-title" id="modalTitulo">Datos del Usuario</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="inputCodigo">
                <div class="mb-3">
                    <label class="fw-bold small">Nombre de Usuario</label>
                    <input type="text" id="inputUsername" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="fw-bold small">Correo Electrónico</label>
                    <input type="email" id="inputEmail" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="fw-bold small">Contraseña</label>
                    <input type="password" id="inputPassword" class="form-control">
                </div>
                <div class="row">
                    <div class="col-6">
                        <label class="fw-bold small">Rol</label>
                        <select id="selectRol" class="form-select">
                            <option value="ADMIN">Administrador</option>
                            <option value="USER">Usuario</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="fw-bold small">Estado</label>
                        <select id="selectEstado" class="form-select">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger me-auto" id="btnEliminar" onclick="ejecutarEliminar()" style="display:none;">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-warning fw-bold" id="btnGuardar" onclick="ejecutarGuardado()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let miModal;
    document.addEventListener("DOMContentLoaded", () => {
        miModal = new bootstrap.Modal(document.getElementById('modalUsuario'));
    });

    function accionBuscar() { const id = prompt("ID del usuario:"); if(id) cargarDatos(id, true); }
    function accionGestionar() { const id = prompt("ID del usuario:"); if(id) cargarDatos(id, false); }

    function prepararNuevo() {
        limpiarForm();
        setModo(true);
        document.getElementById('modalTitulo').innerText = "Nuevo Usuario";
        document.getElementById('btnEliminar').style.display="none";
        miModal.show();
    }

    async function cargarDatos(id, soloLectura) {
        try {
            const res = await fetch(`/usuarios/${id}`);
            if(!res.ok) throw new Error();
            const u = await res.json();
            document.getElementById('inputCodigo').value = u.codigoUsuario;
            document.getElementById('inputUsername').value = u.username;
            document.getElementById('inputEmail').value = u.email;
            document.getElementById('inputPassword').value = u.password;
            document.getElementById('selectRol').value = u.rol;
            document.getElementById('selectEstado').value = u.estado;
            document.getElementById('modalTitulo').innerText = soloLectura ? "Consulta" : "Editar Usuario";
            setModo(!soloLectura);
            miModal.show();
        } catch(e) { alert("Usuario no encontrado."); }
    }

    function setModo(e) {
        ['inputUsername','inputEmail','inputPassword','selectRol','selectEstado'].forEach(i => {
            const el = document.getElementById(i);
            if(el.tagName === "SELECT") el.disabled = !e;
            else el.readOnly = !e;
        });
        document.getElementById('btnGuardar').style.display = e ? "block" : "none";
        document.getElementById('btnEliminar').style.display = (e && document.getElementById('inputCodigo').value) ? "block" : "none";
    }

    async function ejecutarGuardado() {
        const id = document.getElementById('inputCodigo').value;
        const payload = {
            codigoUsuario: id ? parseInt(id) : null,
            username: document.getElementById('inputUsername').value,
            email: document.getElementById('inputEmail').value,
            password: document.getElementById('inputPassword').value,
            rol: document.getElementById('selectRol').value,
            estado: parseInt(document.getElementById('selectEstado').value)
        };

        const url = id ? `/usuarios/api/${id}` : '/usuarios/api';
        const metodo = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: metodo,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if(res.ok) location.reload();
        else alert("Error al guardar cambios.");
    }

    async function ejecutarEliminar() {
        const id = document.getElementById('inputCodigo').value;
        if(confirm("¿Eliminar usuario?")) {
            await fetch(`/usuarios/${id}`, {method: 'DELETE'});
            location.reload();
        }
    }

    function limpiarForm() {
        document.getElementById('inputCodigo').value = "";
        ['inputUsername','inputEmail','inputPassword'].forEach(i => document.getElementById(i).value = "");
    }
</script>
</body>
</html>
