<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/Ventas.css}">
</head>
<body>

<div class="container-fluid px-5 mt-4">
    <h1 class="titulo-seccion text-center mb-4">HISTORIAL DE VENTAS</h1>

    <div class="btn-toolbar-custom mb-4 d-flex justify-content-start gap-2">
        <a th:href="@{/Home}" class="btn btn-outline-warning btn-custom"><i class="bi bi-house"></i> Inicio</a>
        <button type="button" class="btn btn-info text-white btn-custom" onclick="accionBuscar()"><i class="bi bi-search"></i> Buscar Factura</button>
        <button type="button" class="btn btn-success btn-custom" onclick="prepararNuevo()"><i class="bi bi-cart-plus-fill"></i> Nueva Venta</button>
        <button type="button" class="btn btn-warning fw-bold btn-custom" onclick="accionGestionar()"><i class="bi bi-gear-fill"></i> Gestionar ID</button>
    </div>

    <div class="tabla-contenedor shadow-lg">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th style="width: 10%;">Factura </th>
                <th style="width: 15%;">Fecha</th>
                <th style="width: 20%;">DPI Cliente</th>
                <th style="width: 15%;">ID Usuario</th>
                <th style="width: 20%;">Total</th>
                <th style="width: 20%;">Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${listaVentas}">
                <td th:text="${v.codigoVenta}" class="fw-bold"></td>
                <td th:text="${v.fechaVenta}"></td>
                <td th:text="${v.clienteDpiCliente}"></td>
                <td th:text="${v.usuarioCodigoUsuario}"></td>
                <td th:text="${'Q' + v.total}" class="text-success fw-bold"></td>
                <td class="text-center align-middle">
                        <span th:text="${v.estado == 1 ? 'Completada' : 'Cancelada'}"
                              th:class="${v.estado == 1 ? 'texto-verde' : 'texto-rojo'}">
                        </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade text-dark" id="modalVenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-warning">
                <h5 class="modal-title" id="modalTitulo">Datos de la Venta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="inputCodigo">
                <div class="mb-3">
                    <label class="fw-bold small">Fecha de Venta</label>
                    <input type="date" id="inputFecha" class="form-control">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="fw-bold small">DPI Cliente</label>
                        <input type="number" id="inputDpi" class="form-control" placeholder="DPI registrado">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="fw-bold small">ID Usuario (Vendedor)</label>
                        <input type="number" id="inputUsuario" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small">Monto Total (Q)</label>
                    <input type="number" step="0.01" id="inputTotal" class="form-control" placeholder="0.00">
                </div>
                <div class="mb-3">
                    <label class="fw-bold small">Estado de Transacción</label>
                    <select id="selectEstado" class="form-select">
                        <option value="1">Completada</option>
                        <option value="0">Cancelada</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger me-auto" id="btnEliminar" onclick="ejecutarEliminar()" style="display:none;">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-warning fw-bold" id="btnGuardar" onclick="ejecutarGuardado()">Registrar Venta</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let miModal;
    document.addEventListener("DOMContentLoaded", () => {
        miModal = new bootstrap.Modal(document.getElementById('modalVenta'));
    });

    function accionBuscar() { const id = prompt("Número de Factura:"); if(id) cargarDatos(id, true); }
    function accionGestionar() { const id = prompt("Número de Factura:"); if(id) cargarDatos(id, false); }

    function prepararNuevo() {
        limpiarForm();
        setModo(true);
        // Poner fecha de hoy por defecto
        document.getElementById('inputFecha').value = new Date().toISOString().split('T')[0];
        document.getElementById('modalTitulo').innerText = "Nueva Venta";
        document.getElementById('btnEliminar').style.display="none";
        miModal.show();
    }

    async function cargarDatos(id, soloLectura) {
        try {
            const res = await fetch(`/ventas/${id}`);
            if(!res.ok) throw new Error();
            const v = await res.json();

            document.getElementById('inputCodigo').value = v.codigoVenta;
            document.getElementById('inputFecha').value = v.fechaVenta;
            document.getElementById('inputDpi').value = v.clienteDpiCliente;
            document.getElementById('inputUsuario').value = v.usuarioCodigoUsuario;
            document.getElementById('inputTotal').value = v.total;
            document.getElementById('selectEstado').value = v.estado;

            document.getElementById('modalTitulo').innerText = soloLectura ? "Detalle de Factura" : "Editar Venta";
            setModo(!soloLectura);
            miModal.show();
        } catch(e) { alert("Venta no encontrada."); }
    }

    function setModo(e) {
        ['inputFecha','inputDpi','inputUsuario','inputTotal','selectEstado'].forEach(i => {
            const el = document.getElementById(i);
            if(el.tagName === "SELECT") el.disabled = !e;
            else el.readOnly = !e;
        });
        document.getElementById('btnGuardar').style.display = e ? "block" : "none";
        document.getElementById('btnEliminar').style.display = (e && document.getElementById('inputCodigo').value) ? "block" : "none";
    }

    async function ejecutarGuardado() {
        const id = document.getElementById('inputCodigo').value;
        const payload = {
            codigoVenta: id ? parseInt(id) : null,
            fechaVenta: document.getElementById('inputFecha').value,
            clienteDpiCliente: parseInt(document.getElementById('inputDpi').value),
            usuarioCodigoUsuario: parseInt(document.getElementById('inputUsuario').value),
            total: parseFloat(document.getElementById('inputTotal').value),
            estado: parseInt(document.getElementById('selectEstado').value)
        };

        const res = await fetch('/ventas', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if(res.ok) location.reload();
        else alert("Error al registrar venta. Verifique que el DPI y el ID Usuario existan.");
    }

    async function ejecutarEliminar() {
        const id = document.getElementById('inputCodigo').value;
        if(confirm("¿Eliminar registro de venta?")) {
            await fetch(`/ventas/${id}`, {method: 'DELETE'});
            location.reload();
        }
    }

    function limpiarForm() {
        document.getElementById('inputCodigo').value = "";
        ['inputFecha', 'inputDpi', 'inputUsuario', 'inputTotal'].forEach(i => document.getElementById(i).value = "");
        document.getElementById('selectEstado').value = "1";
    }
</script>
</body>
</html>
